apiVersion: apps/v1
kind: Deployment
metadata:
  name: prior-router
  namespace: securechat-vault
  labels:
    app: prior-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prior-router
  template:
    metadata:
      labels:
        app: prior-router
    spec:
      containers:
        - name: prior-router
          image: securechat-prior-router:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: PORT
              value: "8090"
            - name: GATEWAY_KEY
              valueFrom:
                secretKeyRef:
                  name: securechat-secrets
                  key: GATEWAY_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: securechat-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: securechat-secrets
                  key: GROQ_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: prior-router
  namespace: securechat-vault
spec:
  selector:
    app: prior-router
  ports:
    - port: 8090
      targetPort: 8090
