apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: securechat-vault
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        # Kubernetes has no depends_on: wait until Mongo accepts authenticated
        # connections, otherwise the backend's single connect() attempt fails.
        - name: wait-for-mongo
          image: mongo:7
          command:
            - sh
            - -c
            - >
              until mongosh "$MONGO_URI" --quiet --eval "db.adminCommand({ ping: 1 })" >/dev/null 2>&1;
              do echo "waiting for mongo..."; sleep 2; done
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: securechat-secrets
                  key: MONGO_URI
      containers:
        - name: backend
          image: securechat-server:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: securechat-config
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: securechat-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: securechat-secrets
                  key: JWT_SECRET
            - name: GATEWAY_KEY
              valueFrom:
                secretKeyRef:
                  name: securechat-secrets
                  key: GATEWAY_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: securechat-vault
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
