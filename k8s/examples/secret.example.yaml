apiVersion: v1
kind: Secret
metadata:
  name: securechat-secrets
  namespace: securechat-vault
type: Opaque
stringData:
  # MongoDB root credentials (used by the mongo Deployment).
  MONGO_ROOT_USERNAME: "<your-mongo-username>"
  MONGO_ROOT_PASSWORD: "<your-mongo-password>"
  # Full connection string used by the backend and the seed Job. Percent-encode
  # the password if it contains @ : / # $ and keep authSource=admin.
  MONGO_URI: "mongodb://<your-mongo-username>:<your-mongo-password>@mongo:27017/securechat?authSource=admin"
  # Backend auth and shared API/gateway key (must be identical for backend,
  # redactor and prior-router).
  JWT_SECRET: "<your-jwt-secret>"
  GATEWAY_KEY: "<your-gateway-key>"
  # LLM providers read by prior-router; at least one is needed.
  OPENROUTER_API_KEY: "<your-openrouter-key>"
  GROQ_API_KEY: "<your-groq-key>"
  # Seeded admin account (ADMIN_PASSWORD must be 8+ characters).
  ADMIN_EMAIL: "admin@securechat.local"
  ADMIN_PASSWORD: "<your-admin-password>"
  ADMIN_NAME: "Administrator"
