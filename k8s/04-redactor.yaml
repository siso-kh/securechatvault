apiVersion: apps/v1
kind: Deployment
metadata:
  name: redactor
  namespace: securechat-vault
  labels:
    app: redactor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redactor
  template:
    metadata:
      labels:
        app: redactor
    spec:
      containers:
        - name: redactor
          image: securechat-redactor:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            - name: GATEWAY_KEY
              valueFrom:
                secretKeyRef:
                  name: securechat-secrets
                  key: GATEWAY_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redactor
  namespace: securechat-vault
spec:
  selector:
    app: redactor
  ports:
    - port: 5001
      targetPort: 5001
